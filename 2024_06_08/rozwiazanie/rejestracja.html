<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sklep - rejestracja</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <aside>
        <img src="obraz.png" alt="promocje">

        <h2>Sprawdź promocje</h2>

        <table>
            <tr>
                <th>co?</th>
                <th>ile taniej?</th>
            </tr>
            <tr>
                <td>ubrania</td>
                <td>15%</td>
            </tr>
            <tr>
                <td>buty</td>
                <td>25%</td>
            </tr>
        </table>
    </aside>
    <header>
        <h1>Zarejestruj się w sklepie</h1>
    </header>
    <main>
        <button type="button" onclick="aktywuj('blok1')">Klient</button>
        <button type="button" onclick="aktywuj('blok2')">Adres</button>
        <button type="button" onclick="aktywuj('blok3')">Kontakt</button>

        <section id="blok1">
            <p>Imię</p>
            <input type="text" placeholder="Wpisz dane..." onblur="aktualizuj()" id="imie">

            <p>Nazwisko</p>
            <input type="text" onblur="aktualizuj()" id="nazwisko">

            <p>Data urodzenia</p>
            <input type="date" onblur="aktualizuj()" id="data">
        </section>
        <section id="blok2">
            <p>Ulica</p>
            <input type="text" onblur="aktualizuj()" id="ulica">

            <p>Numer</p>
            <input type="number" onblur="aktualizuj()" id="numer">

            <p>Miasto</p>
            <input type="text" onblur="aktualizuj()" id="miasto">
        </section>
        <section id="blok3">
            <p>Numer komórkowy</p>
            <input type="tel" onblur="aktualizuj()" id="nrTel">
            <br>

            <input type="checkbox" id="wybor">
            <label for="wybor">Akceptuję RODO</label>
            <br>

            <button type="button" onclick="zatwierdz()">Zatwierdź dane</button>
        </section>  
    </main>
    <section id="postep">
        <section id="pusty"></section>
    </section>
    <footer>
        <h4>Rejestrację do sklepu wykonał: maci</h4>
    </footer>
</body>
<script src="skrypt.js"></script>
</html>
